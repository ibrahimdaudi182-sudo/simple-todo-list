<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #182230;
      --muted: #667085;
      --border: #e4e7ec;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 640px;
      margin: 40px auto;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(16, 24, 40, 0.07);
    }

    header { margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.7rem, 5vw, 2.2rem); }
    .subtitle { margin: 0; color: var(--muted); }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid #cfd4dc;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .add-button { color: white; background: var(--accent); }
    .add-button:hover { background: var(--accent-hover); }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 8px 0 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .filters { display: flex; gap: 5px; }
    .filter-button {
      padding: 6px 10px;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .filter-button.active { background: #eaf0ff; color: #1d4ed8; }

    #taskList { list-style: none; padding: 0; margin: 0; }
    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 2px;
      border-bottom: 1px solid var(--border);
    }
    .task:last-child { border-bottom: 0; }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .task-text { flex: 1; overflow-wrap: anywhere; }
    .task.completed .task-text {
      color: #98a2b3;
      text-decoration: line-through;
    }

    .delete-button {
      padding: 7px 9px;
      color: var(--danger);
      background: #fff1f2;
      font-size: 0.85rem;
    }
    .delete-button:hover { background: #ffe4e6; }

    .empty-state {
      padding: 30px 10px;
      text-align: center;
      color: var(--muted);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .clear-button {
      padding: 6px 0;
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .clear-button:hover { color: var(--danger); }

    @media (max-width: 480px) {
      .app { margin: 12px auto; padding: 20px 16px; }
      form { flex-direction: column; }
      .add-button { width: 100%; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>My To-Do List</h1>
      <p class="subtitle">Keep track of what matters, one task at a time.</p>
    </header>

    <form id="taskForm">
      <input id="taskInput" type="text" placeholder="What do you need to do?" maxlength="200" autocomplete="off" aria-label="New task" required>
      <button class="add-button" type="submit">Add task</button>
    </form>

    <section aria-label="Tasks">
      <div class="toolbar">
        <span id="taskCount">0 tasks left</span>
        <div class="filters" aria-label="Filter tasks">
          <button type="button" class="filter-button active" data-filter="all">All</button>
          <button type="button" class="filter-button" data-filter="active">Active</button>
          <button type="button" class="filter-button" data-filter="completed">Completed</button>
        </div>
      </div>
      <ul id="taskList"></ul>
      <p id="emptyState" class="empty-state">No tasks yet. Add your first task above.</p>
    </section>

    <footer class="footer">
      <span>Tasks are saved in this browser.</span>
      <button id="clearCompleted" class="clear-button" type="button">Clear completed</button>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "simple-todo-list-tasks";
    const taskForm = document.querySelector("#taskForm");
    const taskInput = document.querySelector("#taskInput");
    const taskList = document.querySelector("#taskList");
    const taskCount = document.querySelector("#taskCount");
    const emptyState = document.querySelector("#emptyState");
    const filterButtons = document.querySelectorAll("[data-filter]");
    const clearCompletedButton = document.querySelector("#clearCompleted");

    let tasks = loadTasks();
    let currentFilter = "all";

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter(
          task => task && typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
        ) : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch {
        alert("Your browser could not save tasks. Check your browser storage settings.");
      }
    }

    function renderTasks() {
      taskList.replaceChildren();
      const visibleTasks = tasks.filter(task => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      visibleTasks.forEach(task => {
        const item = document.createElement("li");
        item.className = `task${task.completed ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `Mark ${task.text} as ${task.completed ? "active" : "completed"}`);
        checkbox.addEventListener("change", () => {
          tasks = tasks.map(entry => entry.id === task.id
            ? { ...entry, completed: checkbox.checked }
            : entry);
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.textContent = "Delete";
        deleteButton.setAttribute("aria-label", `Delete ${task.text}`);
        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(entry => entry.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, text, deleteButton);
        taskList.append(item);
      });

      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent = `${remaining} task${remaining === 1 ? "" : "s"} left`;
      emptyState.hidden = visibleTasks.length > 0;
      emptyState.textContent = tasks.length === 0
        ? "No tasks yet. Add your first task above."
        : "No tasks in this filter.";

      filterButtons.forEach(button => {
        const selected = button.dataset.filter === currentFilter;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });

      clearCompletedButton.disabled = !tasks.some(task => task.completed);
      clearCompletedButton.style.opacity = clearCompletedButton.disabled ? "0.5" : "1";
    }

    taskForm.addEventListener("submit", event => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) return;

      tasks.unshift({
        id: (typeof crypto !== "undefined" && crypto.randomUUID)
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text,
        completed: false
      });

      saveTasks();
      currentFilter = "all";
      taskInput.value = "";
      taskInput.focus();
      renderTasks();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        renderTasks();
      });
    });

    clearCompletedButton.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    });

    renderTasks();
  </script>
</body>
</html>
